name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter and type check
        run: npm run lint

      - name: Validate content
        run: npm run validate

      - name: Run engine and coach regression tests
        run: |
          npm run test:engine
          npm run test:coach

      - name: Build static web app
        run: npm run build
        env:
          VITE_BASE_PATH: /ChessPath/

      - name: Verify no /api/ backend routes exist in src or dist
        run: |
          if grep -rn "/api/" src dist; then
            echo "Error: Found forbidden '/api/' backend route reference in src or dist!"
            exit 1
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
